# flowtrack – Einstellungen. Nach Änderungen einfach neu starten.

camera:
  source: 0            # 0 = erste Kamera (iPhone per Continuity-Kamera oder Webcam), "demo" = ohne Kamera testen
  width: 1280
  height: 720
  fps: 60
  # exposure: -6       # manuelle Belichtung (niedriger = dunkler). Wird nicht von jeder Kamera unterstützt.

calibration_file: calibration.json   # wird von "python -m flowtrack calibrate" erzeugt

# Position des Beamer-Bildschirms in macOS (Systemeinstellungen → Displays → Anordnen).
# Steht der Beamer rechts neben einem 1920 px breiten Hauptbildschirm: x 1920, y 0.
projector_window: {x: 1920, y: 0}

tracking:
  detect: brightness   # "brightness" = Feuer / IR / helle LEDs, "color" = Farbe, "pose" = KI-Körpererkennung
  threshold: 200       # Helligkeitsschwelle 0..255 (live mit +/- anpassbar)
  hsv_low:  [40, 120, 120]   # nur bei detect: color. Voreinstellung = Grün
  hsv_high: [85, 255, 255]
  # nur bei detect: pose (KI, MediaPipe). Der erste Punkt ist der Hauptpunkt (x/y).
  # möglich: right_hand, left_hand, right_wrist, left_wrist, right_elbow, left_elbow,
  #          right_foot, left_foot, nose, center
  pose_points: [right_hand, left_hand]
  pose_model: lite     # "lite" = schnell, "full" = genauer
  pose_people: 1
  min_area: 20         # kleinere Flecken (Rauschen, Funken) ignorieren
  max_area: 20000
  max_blobs: 4         # höchstens so viele Props gleichzeitig
  mode: largest        # "largest" = größter Punkt, "centroid" = Mitte aller Punkte
  # mask: mask.png     # optional: Schwarz-Weiß-Bild in Kameragröße, schwarze Bereiche werden ignoriert
  lead_ms: 80          # Vorhersage: gleicht Verzögerung bei schnellen Bewegungen aus (0 = aus)
  filter:              # Glättung (One-Euro): min_cutoff kleiner = ruhiger, beta größer = schneller
    min_cutoff: 1.0
    beta: 0.3

resolume:
  enabled: true
  host: 127.0.0.1      # Resolume auf demselben Mac
  osc_port: 7000       # Resolume → Einstellungen → OSC → OSC Input aktivieren
  http_port: 8080      # Resolume → Einstellungen → Webserver aktivieren

# Merkmale: x, y (0..1 auf dem Beamerbild), speed, count, spread, present
# Ziel entweder "osc:" (Adresse aus Resolume: Shortcuts → Edit OSC, dann Regler anklicken)
# oder "param:" (Pfad bzw. eindeutiger Teil davon aus "python -m flowtrack discover").
outputs:
  - feature: x
    osc: /composition/layers/1/video/effects/transform/positionx   # Beispiel – Adresse in Resolume prüfen!
    range: [0, 1]
  - feature: y
    osc: /composition/layers/1/video/effects/transform/positiony
    range: [0, 1]
    invert: true
  # Beispiel über REST/WebSocket, ohne OSC-Adresse:
  # - feature: speed
  #   param: "layers/1/video/effects/Bloom/params/Amount"
  #   in: [0, 1.5]          # Tempo 0..1,5 → ganzer Reglerbereich
  #   range: [0, 1]

# Regeln: lösen einmal aus, wenn die Bedingung (mindestens "for" Sekunden) eintritt.
# Bedingungen: present, absent, oder "merkmal > zahl" (>, <, >=, <=, ==)
# Aktionen: clip: [layer, clip] | osc: adresse (+ value) | param: pfad + value | effect: name/next
rules:
  - name: Feuer an
    when: present
    for: 0.3
    do: {clip: [2, 1]}
  - name: Feuer aus
    when: absent
    for: 2.0
    do: {clip: [2, 2]}
  - name: Schnell
    when: "speed > 1.0"
    for: 0.5
    cooldown: 4
    do: {effect: next}

render:                # eigene Effekte (auch ohne Resolume)
  enabled: false       # oder mit --render einschalten
  effect: trails       # trails | ripples | particles | kaleido (live mit 1-4 bzw. n)
  size: [1280, 720]
  internal_scale: 0.5
  decay: 0.90          # wie lange Spuren nachleuchten (0.8 kurz … 0.97 lang)
  color: [40, 140, 255]    # BGR
  color2: [255, 120, 30]
  window: true         # Vollbild auf dem Beamer
  syphon: true         # zusätzlich als Syphon-Quelle für Resolume
